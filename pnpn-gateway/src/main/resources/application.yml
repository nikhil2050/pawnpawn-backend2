server:
  port: 9090

spring:
  application:
    name: pnpn-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:9091
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: catalog-service
          uri: http://catalog-service:9092
          predicates:
            - Path=/api/listings/**,/api/auctions/**,/api/bids/**
        - id: transaction-service
          uri: http://transaction-service:9093
          predicates:
            - Path=/api/orders/**,/api/cart/**,/api/payments/**,/api/reviews/**,/api/resale/**
        - id: messaging-service
          uri: http://messaging-service:9094
          predicates:
            - Path=/api/chat/**,/api/notifications/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 100
              burstCapacity: 200
        - name: CircuitBreaker
          args:
            name: gateway-cb
            fallbackUri: forward:/fallback

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 60s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production}
  expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
