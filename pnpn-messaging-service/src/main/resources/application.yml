server:
  port: 9094

spring:
  application:
    name: pnpn-messaging-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pnpn_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    connectionTimeout: 5000
