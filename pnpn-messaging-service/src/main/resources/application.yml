firebase:
  config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

resilience4j:
  circuitbreaker:
    instances:
      fcm-cb:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
