razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_default}
  key-secret: ${RAZORPAY_KEY_SECRET:default-secret}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_default}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_default}

resilience4j:
  circuitbreaker:
    instances:
      razorpay-cb:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      stripe-cb:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
